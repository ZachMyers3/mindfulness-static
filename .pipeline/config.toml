# Per-project pipeline config (RULES.md Rule 1) for Mindfulness and Movement.
# Read by the pipeline-driver cron (`~/.openclaw/shared/scripts/pipeline-driver.py`)
# every tick. Driver resolves the durable agent IDs against openclaw.json
# before dispatch.

[project]
slug = "yoga-wellness-site"        # matches ~/.openclaw/shared/projects/index.md H2
human_name = "Mindfulness and Movement"
repo = "/home/openclaw/dev/mindfulness-static"
remote_url = "https://github.com/ZachMyers3/mindfulness-static"

[agents]
# Defaults are the durable agent IDs. Override only if a project genuinely
# needs different agents. This project is pure-frontend.
mason_backend  = "mason-backend"
mason_frontend = "mason-frontend"
inspector      = "inspector"
atlas          = "design-doc-writer"
cyclops        = "cyclops-visual-qa"

[merge]
# Auto-merge gate (Rule 7). Mason commits to developer/yoga-wellness-site/*,
# then the driver auto-merges into local develop when Inspector approves.
branch_pat   = "developer/yoga-wellness-site/"
seed_branch  = "developer/yoga-wellness-site/seed"   # seed for fresh content collections
disallow_refs   = ["mal_connected", "marble-"]        # scrub Pheidippides test artifacts
disallow_paths  = []                                 # no path-level forbids for a fresh repo

[verify]
# Smoke check after all `[c]` items land. Static-site smoke: build the site
# and run any available Playwright/Vitest suites. If neither exists in v1,
# fall back to a plain `npm run build` exit-code check.
smoke_command = "npm run build"
smoke_workdir = "/home/openclaw/dev/mindfulness-static"
smoke_timeout_sec = 180

[notify]
# Foreman is the only human-facing role for this project; group + DM both ok.
human_chat_id  = "936483613"
human_group_id = "-5298337016"   # Rocky and Friends
