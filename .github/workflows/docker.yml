# Build the static Astro site into a Docker image and push it to GHCR.
#
# Image: ghcr.io/<owner>/<repo>
# Optional repo variables (Settings → Secrets and variables → Actions → Variables):
#   SITE       — canonical URL baked into the build (sitemap + SEO)
#   BASE_PATH  — Astro base path (default: /)

name: Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=ref,event=branch

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SITE=${{ vars.SITE || 'https://mindfulnessandmovement.example.com' }}
            BASE_PATH=${{ vars.BASE_PATH || '/' }}
